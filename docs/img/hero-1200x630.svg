<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf2c4"/>
      <stop offset="1" stop-color="#2bb3ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="70" y="140" font-family="Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff">Mavera</text>
  <text x="70" y="205" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#9fd3ff">A paid API that pays its share holders on every call</text>
  <text x="70" y="290" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#e6eefc">1. Agents pay $0.01 per call through x402</text>
  <text x="70" y="335" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#e6eefc">2. USDC lands in the share contract, not with the operator</text>
  <text x="70" y="380" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#e6eefc">3. Every holder's claim grows within one Monad block</text>
  <g transform="translate(860 150)">
    <rect x="0" y="0" width="260" height="110" rx="16" fill="#111a33" stroke="#2bb3ff" stroke-width="3"/>
    <text x="130" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9fd3ff">GET /api/price</text>
    <text x="130" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff">402 → pay → 200</text>
    <rect x="118" y="110" width="24" height="90" fill="url(#drip)"/>
    <rect x="0" y="200" width="260" height="110" rx="16" fill="#111a33" stroke="#7cf2c4" stroke-width="3"/>
    <text x="130" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7cf2c4">Mavera contract</text>
    <text x="130" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff">sync() → claimable</text>
    <rect x="40" y="310" width="24" height="70" fill="url(#drip)"/>
    <rect x="196" y="310" width="24" height="70" fill="url(#drip)"/>
    <circle cx="52" cy="405" r="26" fill="#1f3b6e" stroke="#7cf2c4" stroke-width="3"/>
    <circle cx="208" cy="405" r="26" fill="#1f3b6e" stroke="#7cf2c4" stroke-width="3"/>
    <text x="130" y="415" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9fd3ff">holders</text>
  </g>
  <text x="70" y="560" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#9fd3ff">Monad testnet · x402 v2 · Circle USDC · Monad Blitz Ankara v4</text>
  <text x="70" y="600" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6f85a8">Testnet proof of concept. Not an offer of securities.</text>
</svg>
