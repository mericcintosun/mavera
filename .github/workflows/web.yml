name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".env.example"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".env.example"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  web:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm/setup is the successor of pnpm/action-setup for pnpm >= 11. It reads the pinned
      # pnpm version from the root package.json "packageManager" field, installs Node from
      # .nvmrc, restores the store cache and runs `pnpm install --frozen-lockfile`.
      # Fallback (documented in docs/11-TOOLCHAIN.md): pnpm/action-setup@v6 + actions/setup-node@v7.
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: true
          require-lockfile: true

      - name: Provide placeholder env for the build
        run: cp .env.example web/.env.local

      - name: Lint (Biome)
        run: pnpm -r --if-present lint

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Unit tests (Vitest)
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm --filter @mavera/web build
