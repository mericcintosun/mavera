name: contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  forge:
    name: fmt, build, test (Monad execution)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      - name: Versions
        run: forge --version && forge config --json | jq '{solc, evm_version, network, chain_id}'

      - name: Format check
        run: forge fmt --check

      # --locked: fail if the submodules drift from foundry.lock
      - name: Build
        run: forge build --locked --sizes

      - name: Test (unit + fuzz + invariant)
        run: forge test -vvv

  slither:
    name: slither (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Compile with the pinned Foundry (network = "monad" needs >= 1.8) so the Slither
      # container only analyses the artifacts (ignore-compile).
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      - name: Build with build-info
        working-directory: contracts
        run: forge build --build-info --skip test script --force

      - name: Run Slither
        id: slither
        uses: crytic/slither-action@v0.4.2
        continue-on-error: true
        with:
          target: contracts
          ignore-compile: true
          fail-on: none
          sarif: results.sarif
          slither-config: contracts/slither.config.json
          slither-args: --checklist --markdown-root ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/contracts/

      - name: Upload SARIF to code scanning
        if: steps.slither.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

      - name: Publish checklist to the job summary
        if: always()
        env:
          SLITHER_STDOUT: ${{ steps.slither.outputs.stdout }}
        run: |
          {
            echo "## Slither"
            echo
            printf '%s\n' "$SLITHER_STDOUT"
          } >> "$GITHUB_STEP_SUMMARY"
