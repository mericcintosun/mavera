# Mavera — Foundry configuration (Monad testnet).
# Based on monad-developers/foundry-monad, updated for Foundry >= 1.8 (`network = "monad"`).
# Reference: https://docs.monad.xyz/tooling-and-infra/toolkits/foundry.md

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Compiler — pinned for reproducible verification (see docs/11-TOOLCHAIN.md).
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = false
use_literal_content = true

# Monad execution environment: gas model, MIP-8 storage pages, precompiles,
# 128 KB contract size limit. Hardfork defaults to the latest (MonadTen).
network = "monad"
eth_rpc_url = "https://testnet-rpc.monad.xyz"
chain_id = 10143

ffi = false
fs_permissions = []
gas_reports = ["Mavera"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[fuzz]
runs = 512
max_test_rejects = 65536

[invariant]
runs = 128
depth = 64
# Handlers bound their inputs, so any revert is a real finding.
fail_on_revert = true
shrink_run_limit = 5000
show_metrics = true

# Heavier settings for CI (FOUNDRY_PROFILE=ci).
[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 128 }

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_testnet_ankr = "https://rpc.ankr.com/monad_testnet"

# Monadscan (Etherscan-compatible) verification — enabled on event day once the
# API key is in .env. Sourcify needs no key:
#   forge verify-contract <addr> src/Mavera.sol:Mavera --chain 10143 \
#     --verifier sourcify --verifier-url https://sourcify-api-monad.blockvision.org/
# [etherscan]
# monad_testnet = { key = "${MONADSCAN_API_KEY}", chain = 10143 }
