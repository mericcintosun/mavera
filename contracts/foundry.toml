# Mavera — Foundry configuration (Monad testnet).
# Based on monad-developers/foundry-monad, updated for Foundry >= 1.8 (`network = "monad"`).
# Reference: https://docs.monad.xyz/tooling-and-infra/toolkits/foundry.md

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Compiler — pinned for reproducible verification (see docs/11-TOOLCHAIN.md).
# 0.8.37 (2026-09-10): compiles OZ v5.7.0 under evm_version osaka, parsed by Slither 0.11.6,
# listed by Etherscan/Sourcify; auto-detect would pick 0.8.38 (released 2026-10-22).
solc = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
use_literal_content = true

# Monad execution environment: gas model, MIP-8 storage pages, precompiles,
# 128 KB contract size limit. Hardfork defaults to the latest (MonadTen).
network = "monad"
# No default `eth_rpc_url`: it would make every `forge test` fork the public testnet RPC (25 rps cap,
# minutes instead of seconds). Live commands pass `--rpc-url` explicitly (see [rpc_endpoints]).
chain_id = 10143

ffi = false
fs_permissions = []
gas_reports = ["Mavera"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[fuzz]
runs = 512
max_test_rejects = 65536

[invariant]
runs = 128
depth = 64
# Handlers bound their inputs, so any revert is a real finding.
fail_on_revert = true
shrink_run_limit = 5000
show_metrics = true

# Heavier settings for CI (FOUNDRY_PROFILE=ci).
[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 128 }

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_testnet_ankr = "https://rpc.ankr.com/monad_testnet"

# Verification (details and copy-paste commands: docs/07-RUNBOOK.md).
# - MonadVision / Sourcify (no key):
#     forge verify-contract <addr> src/Mavera.sol:Mavera --chain 10143 \
#       --verifier sourcify --verifier-url https://sourcify-api-monad.blockvision.org/
# - Monadscan via the Etherscan V2 API (free etherscan.io key; Foundry >= 1.8 resolves
#   chain 10143 = monad-testnet automatically; the docs' api-testnet.monadscan.com URL is the
#   deprecated V1 endpoint):
#     forge verify-contract <addr> src/Mavera.sol:Mavera --chain 10143 \
#       --verifier etherscan --etherscan-api-key $ETHERSCAN_API_KEY --watch
# [etherscan]
# monad_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 10143 }
